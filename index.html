<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIGIRI Birthday Poster Maker</title>
  <meta name="description" content="Create beautiful AIGIRI birthday posters in seconds.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <header class="header">
      <img class="logo" src="https://koushil24.github.io/aigiri-geleyara-balaga/images/logo.png" alt="AIGIRI logo">
      <div>
        <p class="brand">AIGIRI GELEYARA BALAGA</p>
        <h1>Birthday Poster <span>Maker</span></h1>
      </div>
    </header>

    <!-- STEP 1: inputs -->
    <section class="card">
      <h2>1. Add details</h2>

      <label class="upload" for="photo">
        <span id="uploadText">📷 Choose a photo</span>
        <input type="file" id="photo" accept="image/*">
      </label>

      <label class="label" for="name">Birthday person's name</label>
      <input type="text" id="name" maxlength="30" placeholder="Enter name" autocomplete="off">

      <div id="adjust" class="adjust" hidden>
        <label>Zoom <input type="range" id="zoom" min="100" max="300" value="100"></label>
        <label>Move left / right <input type="range" id="moveX" min="-100" max="100" value="0"></label>
        <label>Move up / down <input type="range" id="moveY" min="-100" max="100" value="0"></label>
      </div>
    </section>

    <!-- STEP 2: live preview -->
    <section class="card">
      <h2>2. Preview</h2>
      <div class="frame"><canvas id="poster" width="1080" height="1350"></canvas></div>

      <button id="download" class="btn gold">⬇ DOWNLOAD POSTER</button>
      <button id="share" class="btn red" hidden>📤 SHARE</button>

      <div class="wish">
        <p id="wishText"></p>
        <button id="copy" class="btn light">📋 Copy wish message</button>
      </div>
    </section>

    <footer>🔒 Your photo never leaves your phone • Friendship • Culture • Service</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
