<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6d0f0f">
  <title>Birthday Poster Maker | AIGIRI GELEYARA BALAGA</title>
  <meta name="description" content="Create a beautiful birthday poster in seconds - AIGIRI GELEYARA BALAGA, Mysuru.">
  <!-- ?v=2 forces the phone to load the NEW files, not old cached ones -->
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <main class="app">

    <!-- ===== STEP 1: THE FORM ===== -->
    <section class="card hero">
      <img class="logo" src="https://koushil24.github.io/aigiri-geleyara-balaga/images/logo.png" alt="AIGIRI logo">
      <h1 class="kn">ಐಗಿರಿ ಗೆಳೆಯರ ಬಳಗ</h1>
      <p class="brand">AIGIRI GELEYARA BALAGA</p>
      <div class="divider"><span>✦</span></div>
      <h2 data-i18n="title">🎂 Birthday Poster Maker</h2>

      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="kn">ಕನ್ನಡ</button>
        <button type="button" data-lang="en">English</button>
      </div>

      <label class="upload" for="photo">
        <span class="up-icon">📷</span>
        <strong id="uploadText">Upload your photo</strong>
        <small data-i18n="fmt">JPG, PNG or WEBP</small>
        <input type="file" id="photo" accept="image/*">
      </label>

      <div class="name-box">
        <span>✏️</span>
        <input type="text" id="name" maxlength="30" placeholder="Enter your name" data-i18n-ph="ph" autocomplete="off">
      </div>

      <button id="makePoster" class="btn main" data-i18n="make">✨ MAKE POSTER →</button>
      <p class="note" data-i18n="note">🔒 Your photo stays in your phone</p>
    </section>

    <!-- ===== STEP 2: RESULT (hidden until button is clicked) ===== -->
    <div id="result" hidden>

      <section class="card message">
        <h3 id="msgTitle">🎂 Happy Birthday!</h3>
        <p id="msgText"></p>
      </section>

      <section class="card">
        <h3 class="center" data-i18n="yours">🎉 Your Birthday Poster</h3>
        <div class="frame"><canvas id="poster" width="1080" height="1350"></canvas></div>

        <details class="adjust">
          <summary data-i18n="adjust">🎯 Adjust photo (zoom / move)</summary>
          <label><span data-i18n="zoom">Zoom</span> <input type="range" id="zoom" min="100" max="300" value="100"></label>
          <label><span data-i18n="lr">Left / Right</span> <input type="range" id="moveX" min="-100" max="100" value="0"></label>
          <label><span data-i18n="ud">Up / Down</span> <input type="range" id="moveY" min="-100" max="100" value="0"></label>
        </details>

        <button id="download" class="btn gold" data-i18n="download">⬇ DOWNLOAD POSTER</button>
        <button id="share" class="btn main" data-i18n="share" hidden>📤 SHARE POSTER</button>
      </section>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer>
      <img src="https://koushil24.github.io/aigiri-geleyara-balaga/images/logo.png" alt="">
      <strong>AIGIRI GELEYARA BALAGA</strong>
      <span data-i18n="motto">Friendship • Culture • Service</span>
      <small data-i18n="loc">📍 Mysuru, Karnataka</small>
    </footer>
  </main>

  <script src="script.js?v=4"></script>
</body>
</html>
