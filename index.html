<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AIGIRI Birthday Poster Maker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <h1>AIGIRI Birthday Poster</h1>

        <p class="subtitle">
            Create a birthday poster in seconds
        </p>

        <section class="card">

            <label for="photo">
                Birthday Person Photo
            </label>

            <input
                type="file"
                id="photo"
                accept="image/*"
            >

            <label for="name">
                Birthday Person Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter name"
                maxlength="30"
            >

            <button id="makePoster">
                MAKE POSTER
            </button>

        </section>

        <section id="previewSection" class="preview-section">

            <h2>Your Poster</h2>

            <canvas
                id="posterCanvas"
                width="864"
                height="1536">
            </canvas>

            <button id="downloadPoster">
                DOWNLOAD POSTER
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
